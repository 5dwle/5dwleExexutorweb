
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5DWLE Attach</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #090910;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 700px;
  background: #12121c;
  border: 1px solid #29293a;
  border-radius: 16px;
  overflow: hidden;
}

.header {
  padding: 23px;
  border-bottom: 1px solid #29293a;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 21px;
  font-weight: bold;
}

.logo span {
  color: #a855f7;
}

.status {
  color: #888;
  font-size: 13px;
}

.content {
  padding: 25px;
}

.label {
  color: #999;
  font-size: 12px;
  margin-bottom: 12px;
}

textarea {
  width: 100%;
  height: 280px;
  background: #090910;
  color: #ddd;
  border: 1px solid #333345;
  border-radius: 10px;
  padding: 16px;
  font-size: 14px;
  resize: vertical;
  outline: none;
  font-family: monospace;
}

textarea:focus {
  border-color: #a855f7;
}

.buttons {
  display: flex;
  gap: 12px;
  margin-top: 18px;
}

button {
  flex: 1;
  padding: 15px 10px;
  border: none;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
  color: white;
}

.attach {
  background: #29293a;
}

.load {
  background: linear-gradient(135deg,#a855f7,#6633cc);
}

.clear {
  background: #29293a;
}

.copy {
  background: #29293a;
  margin-top: 12px;
  width: 100%;
}

button:active {
  transform: scale(.98);
}

.footer {
  text-align: center;
  padding: 17px;
  color: #666;
  border-top: 1px solid #29293a;
  font-size: 12px;
}

#message {
  text-align: center;
  color: #a855f7;
  margin-top: 15px;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">5DWLE <span>ATTACH</span></div>
    <div class="status" id="status">Not Connected</div>
  </div>

  <div class="content">

    <div class="label">SCRIPT EDITOR</div>

    <textarea id="script"
      placeholder="Paste your Lua script here..."></textarea>

    <div class="buttons">

      <button class="attach" onclick="attach()">
        Attach
      </button>

      <button class="load" onclick="load()">
        Load
      </button>

      <button class="clear" onclick="clearScript()">
        Clear
      </button>

    </div>

    <button class="copy" onclick="copyScript()">
      Copy Script
    </button>

    <div id="message"></div>

  </div>

  <div class="footer">
    5DWLE Attach • Script Editor
  </div>

</div>

<script>

function message(text) {
  document.getElementById("message").textContent = text;
}

function attach() {
  message("A webpage cannot connect directly to Roblox.");
}

function load() {
  const script = document.getElementById("script").value.trim();

  if (!script) {
    message("Paste a script first!");
    return;
  }

  message("Script ready. Copy it to use in your authorized development environment.");
}

function clearScript() {
  document.getElementById("script").value = "";
  message("Editor cleared.");
}

async function copyScript() {
  const script = document.getElementById("script").value;

  if (!script.trim()) {
    message("Nothing to copy!");
    return;
  }

  try {
    await navigator.clipboard.writeText(script);
    message("Script copied!");
  } catch {
    message("Clipboard unavailable. Select and copy the script manually.");
  }
}

</script>

</body>
</html>
